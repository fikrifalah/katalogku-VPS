server {
  listen 80;
  server_tokens off;
  client_max_body_size 5m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;

  location = /api/health {
    default_type application/json;
    return 200 '{"gateway":"ok"}';
  }

  location ~ "^/api/products(?:/[a-z0-9]{15})?$" {
    rewrite ^/api/products(.*)$ /api/collections/products/records$1 break;
    proxy_pass http://product-service:8090;
  }

  location /api/auth/ {
    proxy_pass http://account-service:8090/api/collections/users/;
  }

  location ~ "^/api/favorites(?:/[a-z0-9]{15})?$" {
    rewrite ^/api/favorites(.*)$ /api/collections/favorites/records$1 break;
    proxy_pass http://account-service:8090;
  }

  location / {
    return 404;
  }
}
