volumes:
  product_data:
  account_data:

services:
  product-service:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - product_data:/pb_data
      - ./pocketbase/pb_hooks:/pb_hooks:ro
    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8091}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  account-service:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - account_data:/pb_data
    ports:
      - "127.0.0.1:${ACCOUNT_PORT:-8092}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      product-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    profiles: ["tunnel"]
